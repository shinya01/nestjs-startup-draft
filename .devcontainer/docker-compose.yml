version: '3.7'
services:
  nest:
    build:
      args:
        - NODE_VER=25
        ## x86_64 or aarch64
        - ARCH=aarch64
      context: .
      dockerfile: Dockerfile
    tty: true
    volumes:
      - ..:/apl
      - ../node_modules:/home/node/app/node_modules
    ports:
      - "3000:3000"

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
